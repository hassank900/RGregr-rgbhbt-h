name: Legitimate Structural Forensic Probe

on:
  workflow_dispatch:

jobs:
  forensic-probe:
    runs-on: windows-latest
    steps:
      - name: Execute Deep Forensic Analysis
        shell: powershell
        run: |
          $Host.UI.RawUI.BufferSize = New-Object Management.Automation.Host.Size(120, 60)
          
          Write-Host "=====================================================================" -ForegroundColor Cyan
          Write-Host "       DEEP STRUCTURAL FORENSIC PROBE (LEGITIMATE ENGINE)            " -ForegroundColor Yellow
          Write-Host "=====================================================================" -ForegroundColor Cyan

          # 1. فحص هوية الصلاحيات والتحقق من كينونة الـ SID الحالي
          Write-Host "`n[+] [1. Token & Privilege Audit]" -ForegroundColor Green
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Host "    * User SID        : $($identity.User.Value)"
          Write-Host "    * Is System/Admin : $($identity.IsSystem)"
          
          # فحص امتلاك صلاحيات التعديل العميق (SeDebugPrivilege الخ)
          $privileges = &whoami /priv /fo csv | ConvertFrom-Csv
          foreach ($p in $privileges) {
              if ($p.PrivilegeName -match "SeDebugPrivilege|SeTakeOwnershipPrivilege") {
                  Write-Host "    * Priv Found      : $($p.PrivilegeName) -> $($p.State)" -ForegroundColor Magenta
              }
          }

          # 2. فحص حالة جدار الحماية وقواعد توجيه المنافذ (Firewall State)
          Write-Host "`n[+] [2. Firewall & Network Isolation State]" -ForegroundColor Green
          $fwDomain = (Get-NetFirewallProfile -Profile Domain).Enabled
          $fwPrivate = (Get-NetFirewallProfile -Profile Private).Enabled
          $fwPublic = (Get-NetFirewallProfile -Profile Public).Enabled
          Write-Host "    * Firewall Status : Domain=$fwDomain | Private=$fwPrivate | Public=$fwPublic"
          
          # التحقق من إمكانية فتح منافذ Loopback
          $loopbackTest = Test-NetConnection -ComputerName "127.0.0.1" -Port 135 -WarningAction SilentlyContinue
          Write-Host "    * Localloopback   : Pingable = $($loopbackTest.TcpTestSucceeded)"

          # 3. فحص بيئة العمليات وعزل العمليات الخلفية (Process Environment)
          Write-Host "`n[+] [3. Process & Execution Environment]" -ForegroundColor Green
          $psVersion = $PSVersionTable.PSVersion.ToString()
          Write-Host "    * PowerShell Ver  : $psVersion"
          Write-Host "    * Execution Policy: $(Get-ExecutionPolicy)"
          
          # كشف ما إذا كانت الحاوية تحت مراقبة محددة لعمليات الـ CI/CD
          $suspiciousHooks = Get-CimInstance Win32_Process | Where-Object { $_.Name -match "agent|runner|listener" }
          foreach ($sh in $suspiciousHooks) {
              Write-Host "    * Host Agent PID  : $($sh.ProcessId) -> $($sh.Name)" -ForegroundColor Yellow
          }

          # 4. فحص مساحات التخزين الحرجة وأذونات الـ ACLs لمجلدات الأدوات
          Write-Host "`n[+] [4. Workspace & ACL Permissions Probe]" -ForegroundColor Green
          $testDir = "C:\Tools"
          New-Item -Path $testDir -ItemType Directory -Force | Out-Null
          $acl = Get-Acl $testDir
          Write-Host "    * C:\Tools Owner  : $($acl.Owner)"
          Write-Host "    * Access Rules    : $($acl.Access.IdentityReference | Select-Object -Unique | Out-String -Stream | ForEach-Object { $_.Trim() })" -join ", "

          Write-Host "=====================================================================" -ForegroundColor Cyan
          Write-Host "       FORENSIC PROBE COMPLETED. ARCHITECTURE FULLY MAPPED.          " -ForegroundColor Cyan
          Write-Host "=====================================================================" -ForegroundColor Cyan
